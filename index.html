<!DOCTYPE html>
<html>
  <head>
    <title>ShopNest project</title>

    <!-- This code is needed for responsive design to work.
      (Responsive design = make the website look good on
      smaller screen sizes like a phone or a tablet). -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Load a font called Roboto from Google Fonts. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Here are the CSS files for this page. -->
    <link rel="stylesheet" href="styles/shared/general.css">
    <link rel="stylesheet" href="styles/shared/header.css">
    <link rel="stylesheet" href="styles/pages/product.css">
  </head>
  <body>
    <div class="shopnest-header">
      <div class="shopnest-header-left-section">
        <a href="index.html" class="header-link">
          <img class="shopnest-logo"
            src="images/shopnestlogo_on_dark_background1.png">
          <img class="shopnest-mobile-logo"
            src="images/shopnest-mobile-logo-black-background.png">
        </a>
      </div>

      <div class="shopnest-header-middle-section">
        <input class="search-bar js-search-bar" type="text" placeholder="Search">

        <button class="search-button js-search-button">
          <img class="search-icon" src="images/icons/search-icon.png">
        </button>

        <select class="js-sort-products">
          <option value="">Sort By</option>
          <option value="price-asc">Price: Low to High</option>
          <option value="price-desc">Price: High to Low</option>
          <option value="name-asc">Name: A-Z</option>
          <option value="name-desc">Name: Z-A</option>
        </select>
      </div>

      <div class="shopnest-header-right-section">

        <div class="auth-section js-auth-section">
          <a href="login.html" class="header-link">Login</a>
          <a href="register.html" class="header-link">Register</a>

        </div>


        <a class="orders-link header-link" href="orders.html">
          <span class="returns-text">Returns</span>
          <span class="orders-text">& Orders</span>
        </a>

        <a class="cart-link header-link" href="checkout.html">
          <img class="cart-icon" src="images/icons/cart-icon.png">
          <div class="cart-quantity js-cart-quantity">0</div>
          <div class="cart-text">Cart</div>
          
        </a>
      </div>
    </div>
    
    
    <div class="main">
      <div class="js-loading-spinner">

          <div class="spinner"></div>

          <p>Loading products...</p>

        </div>

      <div class="products-grid js-product-grid">
        

        
        
      </div>
    </div>
    
    
    <script type="module" src="scripts/product/product.js"></script>
  </body>
</html>
