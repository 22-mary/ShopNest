<!DOCTYPE html>
<html>
  <head>
    <title>Checkout</title>

    <!-- This code is needed for responsive design to work.
      (Responsive design = make the website look good on
      smaller screen sizes like a phone or a tablet). -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Load a font called Roboto from Google Fonts. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Here are the CSS files for this page. -->
    <link rel="stylesheet" href="styles/shared/general.css">
    <link rel="stylesheet" href="styles/pages/checkout/checkout-header.css">
    <link rel="stylesheet" href="styles/pages/checkout/checkout.css">
  </head>
  <body>
    <div class="checkout-header">
      <div class="header-content">
        <div class="checkout-header-left-section">
          <a href="index.html">
            <img class="shopnest-logo" src="images/shopnestlogo_on_white_bacground.jpg">
            <img class="shopnest-mobile-logo" src="images/ShopNestMobileLogo.png">
          </a>
        </div>

        <div class="checkout-header-middle-section js-checkout-header">
          
        </div>

        <div class="checkout-header-right-section">

          
          <div class="js-auth-section">

            <a class="cart-link header-link" href="checkout.html">
              <img class="cart-icon" src="images/icons/black-cart-icon.png">
              <div class="cart-quantity js-cart-quantity">0</div>
              <div class="cart-text">Cart</div>
            </a>
         </div>

          
        </div>
      </div>
    </div>
    <p class="js-cart-empty-message"></p>

    <div class="main">

      <div class="page-title">Review your order</div>

      <div class="js-loading-spinner">
        <div class="spinner"></div>
        <p>Loading checkout...</p>
      </div>

      <div class="checkout-grid">
        <div class="order-summary js-order-summary">
          
        </div>

        <div class="payment-summary js-payment-summary">
        </div>
      </div>
    </div>
    <script type="module" src="scripts/checkout/checkout.js"></script>
  </body>
</html>
