<!DOCTYPE html>
<html>
    <head>
        <title>Register</title>
        <link rel="stylesheet" href="styles/pages/login.css">
    </head>
    <body>
        
        

        <div class="login-container">
            <div class="header">
                <a>
                <img class="amazon-mobile-logo"
                src="images/amazon-logo-black-transparent.png">
                </a>
            </div>
            <form class="login-form js-login-form">
                <h2>Login</h2>
                
                <div class="login-form-group">
                    <label>Email</label>
                    <input type="email" class="email js-email" placeholder="Enter email" required>

                </div>
                
                
                <div class="login-form-group">
                    <label>Password</label>
                    <input type="password" class="password js-password" placeholder="Atleast 6 characters"required>
                    <small>Password must be atleast 6 characters</small>
                </div>

            
                <div class="submit-button">
                    <button type="submit" class="create-account-button">Login</button>
                </div>
                
            </form>
            <p class="login-link">Already have an account?<a href="login.html">Sign In</a>
            </p>


        </div>
        <script type="module" src="scripts/login.js"></script>
    </body>
</html>
